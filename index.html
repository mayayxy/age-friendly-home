<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#10201a" />
  <title>安居适老助手</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="camera-app">
    <video id="camera" class="camera-video" playsinline muted autoplay></video>
    <canvas id="frameCanvas" hidden></canvas>

    <div class="camera-shade" aria-hidden="true"></div>

    <header class="camera-top">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">安居适老助手</span>
      </div>
      <p class="camera-hint" id="statusText">正在启动相机...</p>
    </header>

    <div class="viewfinder" aria-hidden="true">
      <span class="corner tl"></span>
      <span class="corner tr"></span>
      <span class="corner bl"></span>
      <span class="corner br"></span>
    </div>

    <div class="camera-bottom">
      <p class="scan-tip" id="scanTip">对准空间，静止片刻即可自动识别</p>
      <button type="button" class="shutter" id="scanBtn" disabled>
        <span id="scanLabel">识别</span>
      </button>
    </div>

    <div class="permission-card" id="permissionCard" hidden>
      <h1>需要使用相机</h1>
      <p>请允许相机权限，对准想改造的空间后，系统会弹出适老化建议。</p>
      <button type="button" class="btn btn-primary" id="startCamBtn">开启相机</button>
      <p class="perm-note" id="modelHint">正在检查模型服务...</p>
    </div>
  </div>

  <div class="sheet-mask" id="sheetMask" hidden></div>
  <aside class="result-sheet" id="resultSheet" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="result-head">
      <div class="result-copy">
        <p class="result-kicker">识别为 <span id="detectedScene">卫生间</span></p>
        <h2 id="resultTitle">安全评分</h2>
        <p class="result-summary" id="resultSummary"></p>
      </div>
      <div class="score-block">
        <div class="score-row">
          <span class="score-num" id="scoreNum">0</span>
          <span class="score-unit">分</span>
        </div>
        <span class="score-badge" id="scoreBadge">建议优化</span>
      </div>
    </div>

    <div class="result-body">
      <div>
        <h3>风险评估</h3>
        <div class="risk-list" id="riskList"></div>
      </div>
      <div id="unjudgableBlock" hidden>
        <h3>图片无法判断</h3>
        <ul class="upgrade-list" id="unjudgableList"></ul>
      </div>
    </div>

    <div class="sheet-actions">
      <button type="button" class="btn btn-primary" id="rescanBtn">继续扫描</button>
      <button type="button" class="btn btn-ghost" id="closeSheetBtn">关闭</button>
    </div>
  </aside>

  <div class="toast" id="toast" hidden></div>
  <script src="app-web.js"></script>
</body>
</html>
